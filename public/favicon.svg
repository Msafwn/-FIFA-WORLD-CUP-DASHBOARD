<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ballShade" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="patchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Ball Base -->
  <circle cx="32" cy="32" r="30" fill="url(#ballShade)" stroke="#0f172a" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Center Pentagon -->
  <polygon points="32,20 41,27 38,38 26,38 23,27" fill="url(#patchGrad)" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
  
  <!-- Outer Pentagon Edges and Patches -->
  <!-- Top line & patch -->
  <line x1="32" y1="20" x2="32" y2="4.5" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <polygon points="26,2.5 38,2.5 35,7.5 29,7.5" fill="url(#patchGrad)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Top-Right line & patch -->
  <line x1="41" y1="27" x2="55" y2="19" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <polygon points="55,19 61,25 57,33 50,29" fill="url(#patchGrad)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Bottom-Right line & patch -->
  <line x1="38" y1="38" x2="49" y2="51" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <polygon points="49,51 43,59 34,61 38,53" fill="url(#patchGrad)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Bottom-Left line & patch -->
  <line x1="26" y1="38" x2="15" y2="51" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <polygon points="15,51 21,59 30,61 26,53" fill="url(#patchGrad)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Top-Left line & patch -->
  <line x1="23" y1="27" x2="9" y2="19" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <polygon points="9,19 3,25 7,33 14,29" fill="url(#patchGrad)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Connecting seams between surrounding patches -->
  <line x1="50" y1="29" x2="49" y2="51" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="29" x2="15" y2="51" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="7.5" x2="55" y2="19" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="7.5" x2="9" y2="19" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 3D Gloss Highlight -->
  <path d="M 14 18 A 22 22 0 0 1 30 8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
</svg>